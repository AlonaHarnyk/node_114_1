tags:
  - Products
summary: Get all products
operationId: getAllProducts
description: 'Get all products'
security:
  - bearerAuth: []
responses:
  '200':
    description: 'Get all products'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found products!
            data:
              type: array
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'

